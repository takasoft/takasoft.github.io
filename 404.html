    <h1 class="page-title">404: Page not found</h1>
    <p class="lead">It looks like this page doesn't exist. It may have moved or been merged into another post.
    <br>
    Redirecting you to the <a href="/">homepage</a> in <span id="countdown">5</span> seconds&hellip;</p>
  </div>

<noscript>
  <meta http-equiv="refresh" content="5; url=/">
</noscript>

<script>
  (function () {
    var seconds = 5;
    var home = "/";
    var el = document.getElementById("countdown");
    var timer = setInterval(function () {
      seconds -= 1;
      if (el) { el.textContent = seconds; }
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(home);
      }
    }, 1000);
  })();
</script>

  <!-- Infinite scroll for the post list. Only kicks in on pages that
       expose the #load-more button (homepage + paginated /pageN/ pages).
       Falls back gracefully: with JS off, the button is a normal link
       to the next page. -->
  <script>
    (function () {
      const button = document.getElementById('load-more');
      if (!button) return;

      let loading = false;

      async function loadMore() {
        if (loading) return;
        const nextUrl = button.getAttribute('href');
        if (!nextUrl) return;

        loading = true;
        const originalText = button.textContent;
        button.textContent = 'Loading…';

        try {
          const res = await fetch(nextUrl);
          if (!res.ok) throw new Error(res.status);
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');

          const container = document.querySelector('.posts');
          doc.querySelectorAll('.posts > .post, .posts > hr').forEach(node => {
            container.appendChild(document.importNode(node, true));
          });

          const nextButton = doc.getElementById('load-more');
          if (nextButton && nextButton.getAttribute('href')) {
            button.setAttribute('href', nextButton.getAttribute('href'));
            button.textContent = originalText;
          } else {
            button.parentElement.remove();
          }
        } catch (e) {
          console.error('Failed to load more posts:', e);
          button.textContent = originalText + ' (retry)';
        } finally {
          loading = false;
        }
      }

      // Auto-trigger when the button scrolls into view.
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) loadMore(); });
      }, { rootMargin: '200px' });
      observer.observe(button);

      // Handle manual click too — prevent navigation, do the fetch instead.
      button.addEventListener('click', (e) => { e.preventDefault(); loadMore(); });
    })();
  </script>

  <!-- Mermaid: lazy-load only on pages that have ```mermaid blocks. -->
  <script type="module">
    if (document.querySelector('.language-mermaid')) {
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
      document.querySelectorAll('.language-mermaid').forEach(el => {
        const code = el.textContent;
        const target = el.closest('pre') || el;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code;
        target.replaceWith(div);
      });
      mermaid.initialize({ startOnLoad: false, theme: 'default' });
      await mermaid.run();
    }
  </script>
